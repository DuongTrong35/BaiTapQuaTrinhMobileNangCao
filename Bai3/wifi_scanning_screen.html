
<style>
@keyframes pulse-ring {
  0% { transform: scale(0.85); opacity: 0.6; }
  50% { transform: scale(1.15); opacity: 0.15; }
  100% { transform: scale(0.85); opacity: 0.6; }
}
@keyframes pulse-ring2 {
  0% { transform: scale(0.85); opacity: 0.4; }
  50% { transform: scale(1.3); opacity: 0.08; }
  100% { transform: scale(0.85); opacity: 0.4; }
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes dot-blink {
  0%,80%,100% { opacity: 0.2; }
  40% { opacity: 1; }
}
.dot1 { animation: dot-blink 1.4s infinite 0s; }
.dot2 { animation: dot-blink 1.4s infinite 0.2s; }
.dot3 { animation: dot-blink 1.4s infinite 0.4s; }
.found-item { animation: fadeSlideIn 0.4s ease both; }
</style>

<div style="max-width:380px;margin:0 auto;font-family:'Segoe UI',sans-serif;background:#fff;min-height:700px;display:flex;flex-direction:column;border-radius:24px;overflow:hidden;border:0.5px solid var(--color-border-tertiary);">
